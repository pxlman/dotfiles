# ========================================
# OPACITY WINDOW RULES
# Transparency settings for applications
# ========================================

# Import global variables
source = $HOME/.config/hypr/config/variables.conf

# ========================================
# SYSTEM APPLICATIONS
# ========================================
windowrule = opacity $opacityFloat $opacityFloat,class:^(Dunst)$
windowrule = opacity $opacityFloat $opacityFloat,class:^(hyprswitch)$

# ========================================
# FILE MANAGERS
# ========================================
windowrule = opacity $opacityFloat $opacityFloat,class:^(thunar)$

# ========================================
# DEVELOPMENT TOOLS
# ========================================
windowrule = opacity $opacityFloat $opacityFloat,class:^(code)$
windowrule = opacity $opacityFloat $opacityFloat,class:^(cursor)$
windowrule = opacity $opacityFloat $opacityFloat,class:^(kiro-url-handler)$

# ========================================
# TERMINAL APPLICATIONS
# ========================================
windowrule = opacity $opacityActive $opacityFloat,title:^(nvim.*)$
windowrule = opacity $opacityFloat $opacityFloat,title:^([(zsh)(bash)(sh)(fish)]*)$

# ========================================
# UTILITIES
# ========================================
windowrule = opacity $opacityFloat $opacityFloat,class:^(balenaEtcher)$

# ========================================
# CUSTOM OPACITY EXAMPLES (COMMENTED)
# ========================================
# windowrule = opacity 0.95 0.95,class:^(firefox)$
# windowrule = opacity 0.85 0.85,class:^(discord)$
# windowrule = opacity 0.90 0.90,class:^(spotify)$

# ========================================
# GROMIT-MPX (SCREEN ANNOTATION TOOL)
# ========================================

windowrulev2 = noblur, class:Gromit-mpx
windowrulev2 = opacity 1.0, class:Gromit-mpx
windowrulev2 = noshadow, class:Gromit-mpx
windowrulev2 = size 100% 100%, class:Gromit-mpx
windowrulev2 = pin, class:Gromit-mpx
windowrulev2 = float, class:Gromit-mpx
workspace = special:gromit, gapsin:0, gapsout:0, on-created-empty: gromit-mpx -a


